workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

stages:
  - test
  - build
  - deploy

default:
  tags:
    - unity
    - windows

test_editmode:
  stage: test
  coverage: '/Line coverage:\s*\d+(?:[.,]\d+)?%/'
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\TestResults" | Out-Null
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Coverage" | Out-Null
    - |
      & "$env:UNITY_PATH" `
        -batchmode -nographics `
        -projectPath "$env:CI_PROJECT_DIR" `
        -runTests -testPlatform EditMode `
        -testResults "$env:CI_PROJECT_DIR\TestResults\editmode-results.xml" `
        -debugCodeOptimization `
        -enableCodeCoverage `
        -coverageResultsPath "$env:CI_PROJECT_DIR\Coverage" `
        -coverageOptions "generateAdditionalMetrics;assemblyFilters:+<assets>" `
        -logFile -
    - |
      $openCover = "$env:CI_PROJECT_DIR\Coverage\pyramids-opencov\EditMode\TestCoverageResults_0001.xml"
      [xml]$oc = Get-Content $openCover
      $visited = [double]$oc.CoverageSession.Summary.visitedSequencePoints
      $total = [double]$oc.CoverageSession.Summary.numSequencePoints
      $line = ([math]::Round(($visited * 100.0) / $total, 2).ToString("0.00") -replace ",", ".")
      Write-Host "Line coverage: $line%"
  artifacts:
    when: always
    reports:
      junit: TestResults/editmode-results.xml
    paths:
      - TestResults/
      - Coverage/

build_windows:
  stage: build
  script:
    - |
      & "$env:UNITY_PATH" `
        -batchmode -nographics -quit `
        -projectPath "$env:CI_PROJECT_DIR" `
        -executeMethod BuildScript.BuildWindows `
        -logFile -
  artifacts:
    when: always
    paths:
      - Builds/Windows/

deploy_package:
  stage: deploy
  needs:
    - build_windows
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Deploy" | Out-Null
    - Compress-Archive -Path "$env:CI_PROJECT_DIR\Builds\Windows\*" -DestinationPath "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" -Force
    - $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/windows-build/$env:CI_COMMIT_SHORT_SHA/Transport-Tycoon.zip"
    - |
      curl.exe --fail --location --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" "$packageUrl"
  artifacts:
    when: always
    paths:
      - Deploy/



