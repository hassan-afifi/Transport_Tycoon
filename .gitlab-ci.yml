workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

stages:
  - test
  - build
  - deploy

default:
  tags:
    - unity
    - windows

test_editmode:
  stage: test
  coverage: '/Line coverage:\s*\d+(?:[.,]\d+)?%/'
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\TestResults" | Out-Null
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Coverage" | Out-Null
    - |
      & "$env:UNITY_PATH" `
        -batchmode -nographics `
        -projectPath "$env:CI_PROJECT_DIR" `
        -runTests -testPlatform EditMode `
        -testResults "$env:CI_PROJECT_DIR\TestResults\editmode-results.xml" `
        -debugCodeOptimization `
        -enableCodeCoverage `
        -coverageResultsPath "$env:CI_PROJECT_DIR\Coverage" `
        -coverageOptions "generateAdditionalMetrics;assemblyFilters:+<assets>;dontClear" `
        -logFile -
      Write-Host "Unity test run exit code: $LASTEXITCODE"
    - |
      & "$env:UNITY_PATH" `
        -batchmode -nographics -quit `
        -projectPath "$env:CI_PROJECT_DIR" `
        -debugCodeOptimization `
        -enableCodeCoverage `
        -coverageResultsPath "$env:CI_PROJECT_DIR\Coverage" `
        -coverageOptions "generateHtmlReport;generateAdditionalReports;generateBadgeReport;assemblyFilters:+<assets>" `
        -logFile -
      Write-Host "Unity report generation exit code: $LASTEXITCODE"
    - |
      $summary = Get-ChildItem -Path "$env:CI_PROJECT_DIR\Coverage" -Filter Summary.xml -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
      if ($summary) {
        [xml]$cov = Get-Content $summary.FullName
        $line = ($cov.CoverageReport.Summary.Linecoverage.ToString() -replace ",", ".")
        Write-Host "Line coverage: $line%"
      } else {
        $openCover = Get-ChildItem -Path "$env:CI_PROJECT_DIR\Coverage" -Filter "TestCoverageResults_*.xml" -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if ($openCover) {
          [xml]$oc = Get-Content $openCover.FullName
          $visited = [double]$oc.CoverageSession.Summary.visitedSequencePoints
          $total = [double]$oc.CoverageSession.Summary.numSequencePoints
          if ($total -gt 0) {
            $percent = [math]::Round(($visited * 100.0) / $total, 2)
            $line = ($percent.ToString("0.00") -replace ",", ".")
            Write-Host "Line coverage: $line%"
          } else {
            Write-Host "Line coverage: 0.00%"
          }
        } else {
          Write-Host "Line coverage: 0.00%"
        }
      }
    - |
      Write-Host "Coverage files:"
      Get-ChildItem -Path "$env:CI_PROJECT_DIR\Coverage" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
    - |
      $targetCobertura = "$env:CI_PROJECT_DIR\Coverage\Cobertura.xml"
      $foundCobertura = Get-ChildItem -Path "$env:CI_PROJECT_DIR\Coverage" -Recurse -File -ErrorAction SilentlyContinue |
        Where-Object { $_.Name -match '(?i)cobertura.*\.xml$' } |
        Sort-Object LastWriteTime -Descending |
        Select-Object -First 1
      if ($foundCobertura) {
        Copy-Item -Path $foundCobertura.FullName -Destination $targetCobertura -Force
        Write-Host "Cobertura staged: $targetCobertura"
      } else {
        @'
<?xml version="1.0" encoding="utf-8"?>
<coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" complexity="0" version="1.0" timestamp="0">
  <sources>
    <source>.</source>
  </sources>
  <packages />
</coverage>
'@ | Set-Content -Path $targetCobertura -Encoding UTF8
        Write-Host "Cobertura report not found; wrote fallback report: $targetCobertura"
      }
  artifacts:
    when: always
    reports:
      junit: TestResults/editmode-results.xml
      coverage_report:
        coverage_format: cobertura
        path: Coverage/Cobertura.xml
    paths:
      - TestResults/
      - Coverage/

build_windows:
  stage: build
  script:
    - |
      & "$env:UNITY_PATH" `
        -batchmode -nographics -quit `
        -projectPath "$env:CI_PROJECT_DIR" `
        -executeMethod BuildScript.BuildWindows `
        -logFile -
  artifacts:
    when: always
    paths:
      - Builds/Windows/

deploy_package:
  stage: deploy
  needs:
    - build_windows
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Deploy" | Out-Null
    - Compress-Archive -Path "$env:CI_PROJECT_DIR\Builds\Windows\*" -DestinationPath "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" -Force
    - $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/windows-build/$env:CI_COMMIT_SHORT_SHA/Transport-Tycoon.zip"
    - |
      curl.exe --fail --location --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" "$packageUrl"
  artifacts:
    when: always
    paths:
      - Deploy/



