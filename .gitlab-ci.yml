workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

stages:
  - test
  - build
  - deploy

default:
  tags:
    - unity
    - windows

test_editmode:
  stage: test
  coverage: '/Line coverage:\s*([0-9]+(?:[.,][0-9]+)?)%/'
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\TestResults" | Out-Null
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Coverage" | Out-Null
    - '& "$env:UNITY_PATH" -batchmode -nographics -quit -projectPath "$env:CI_PROJECT_DIR" -runTests -testPlatform EditMode -testResults "$env:CI_PROJECT_DIR\TestResults\editmode-results.xml" -enableCodeCoverage -coverageResultsPath "$env:CI_PROJECT_DIR\Coverage" -coverageOptions "generateHtmlReport;generateAdditionalMetrics;generateBadgeReport;assemblyFilters:+TransportTycoon.Runtime" -logFile -'
    - 'if (Test-Path "$env:CI_PROJECT_DIR\Coverage\Report\Summary.xml") { [xml]$cov = Get-Content "$env:CI_PROJECT_DIR\Coverage\Report\Summary.xml"; $line = ($cov.CoverageReport.Summary.Linecoverage.ToString() -replace ",", "."); Write-Host "Line coverage: $line%" }'
  artifacts:
    when: always
    reports:
      junit: TestResults/editmode-results.xml
    paths:
      - TestResults/
      - Coverage/

build_windows:
  stage: build
  script:
    - '& "$env:UNITY_PATH" -batchmode -nographics -quit -projectPath "$env:CI_PROJECT_DIR" -executeMethod BuildScript.BuildWindows -logFile -'
  artifacts:
    when: always
    paths:
      - Builds/Windows/

deploy_package:
  stage: deploy
  needs:
    - build_windows
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Deploy" | Out-Null
    - Compress-Archive -Path "$env:CI_PROJECT_DIR\Builds\Windows\*" -DestinationPath "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" -Force
    - $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/windows-build/$env:CI_COMMIT_SHORT_SHA/Transport-Tycoon.zip"
    - 'curl.exe --fail --location --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" "$packageUrl"'
  artifacts:
    when: always
    paths:
      - Deploy/



