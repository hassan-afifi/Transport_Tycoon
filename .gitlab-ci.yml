workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - when: never

stages:
  - test
  - coverage
  - build
  - deploy

default:
  tags:
    - unity
    - windows

variables:
  MIN_COVERAGE: "60"

test_editmode:
  stage: test
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\TestResults" | Out-Null
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Coverage" | Out-Null
    - |
      $args = @(
        "-batchmode",
        "-nographics",
        "-projectPath", "$env:CI_PROJECT_DIR",
        "-runTests",
        "-testPlatform", "EditMode",
        "-testResults", "$env:CI_PROJECT_DIR\TestResults\editmode-results.xml",
        "-debugCodeOptimization",
        "-enableCodeCoverage",
        "-coverageResultsPath", "$env:CI_PROJECT_DIR\Coverage",
        "-coverageOptions", "generateAdditionalMetrics;assemblyFilters:+TransportTycoon.Runtime;dontClear",
        "-logFile", "-"
      )
      $proc = Start-Process -FilePath "$env:UNITY_PATH" -ArgumentList $args -NoNewWindow -Wait -PassThru
      if ($proc.ExitCode -ne 0) {
        throw "Unity EditMode tests failed with exit code $($proc.ExitCode)"
      }
  artifacts:
    when: always
    reports:
      junit: TestResults/editmode-results.xml
    paths:
      - Coverage/

test_playmode:
  stage: test
  needs:
    - job: test_editmode
      artifacts: true
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\TestResults" | Out-Null
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Coverage" | Out-Null
    - |
      $args = @(
        "-batchmode",
        "-nographics",
        "-projectPath", "$env:CI_PROJECT_DIR",
        "-runTests",
        "-testPlatform", "PlayMode",
        "-testResults", "$env:CI_PROJECT_DIR\TestResults\playmode-results.xml",
        "-debugCodeOptimization",
        "-enableCodeCoverage",
        "-coverageResultsPath", "$env:CI_PROJECT_DIR\Coverage",
        "-coverageOptions", "generateAdditionalMetrics;assemblyFilters:+TransportTycoon.Runtime;dontClear",
        "-logFile", "-"
      )
      $proc = Start-Process -FilePath "$env:UNITY_PATH" -ArgumentList $args -NoNewWindow -Wait -PassThru
      if ($proc.ExitCode -ne 0) {
        throw "Unity PlayMode tests failed with exit code $($proc.ExitCode)"
      }
  artifacts:
    when: always
    reports:
      junit: TestResults/playmode-results.xml
    paths:
      - Coverage/

extract_method_coverage:
  stage: coverage
  needs:
    - job: test_playmode
      artifacts: true
  coverage: '/Method coverage:\s*\d+(?:[.,]\d+)?%/'
  script:
    - |
      $args = @(
        "-batchmode",
        "-nographics",
        "-quit",
        "-projectPath", "$env:CI_PROJECT_DIR",
        "-debugCodeOptimization",
        "-enableCodeCoverage",
        "-coverageResultsPath", "$env:CI_PROJECT_DIR\Coverage",
        "-coverageOptions", "generateHtmlReport;generateAdditionalMetrics;generateBadgeReport;assemblyFilters:+TransportTycoon.Runtime",
        "-logFile", "-"
      )
      $proc = Start-Process -FilePath "$env:UNITY_PATH" -ArgumentList $args -NoNewWindow -Wait -PassThru
      if ($proc.ExitCode -ne 0) {
        throw "Unity coverage report generation failed with exit code $($proc.ExitCode)"
      }
      $summary = "$env:CI_PROJECT_DIR\Coverage\Report\Summary.xml"
      [xml]$cov = Get-Content $summary
      $method = [double](($cov.CoverageReport.Summary.Methodcoverage.ToString()) -replace ",", ".")
      $minCoverage = [double]$env:MIN_COVERAGE
      Write-Host "Method coverage: $method%"
      if ($method -lt $minCoverage) {
        throw "Method coverage $method% is below MIN_COVERAGE ($minCoverage%)."
      }

extract_line_coverage:
  stage: coverage
  needs:
    - job: test_playmode
      artifacts: true
  coverage: '/Line coverage:\s*\d+(?:[.,]\d+)?%/'
  script:
    - |
      $args = @(
        "-batchmode",
        "-nographics",
        "-quit",
        "-projectPath", "$env:CI_PROJECT_DIR",
        "-debugCodeOptimization",
        "-enableCodeCoverage",
        "-coverageResultsPath", "$env:CI_PROJECT_DIR\Coverage",
        "-coverageOptions", "generateHtmlReport;generateAdditionalMetrics;generateBadgeReport;assemblyFilters:+TransportTycoon.Runtime",
        "-logFile", "-"
      )
      $proc = Start-Process -FilePath "$env:UNITY_PATH" -ArgumentList $args -NoNewWindow -Wait -PassThru
      if ($proc.ExitCode -ne 0) {
        throw "Unity line coverage extraction failed with exit code $($proc.ExitCode)"
      }
      $summary = "$env:CI_PROJECT_DIR\Coverage\Report\Summary.xml"
      [xml]$cov = Get-Content $summary
      $line = ($cov.CoverageReport.Summary.Linecoverage.ToString() -replace ",", ".")
      Write-Host "Line coverage: $line%"
  artifacts:
    when: always
    paths:
      - Coverage/Report/

build_windows:
  stage: build
  script:
    - |
      & "$env:UNITY_PATH" `
        -batchmode -nographics -quit `
        -projectPath "$env:CI_PROJECT_DIR" `
        -executeMethod BuildScript.BuildWindows `
        -logFile -
  artifacts:
    when: always
    paths:
      - Builds/Windows/

deploy_package:
  stage: deploy
  needs:
    - build_windows
  environment:
    name: Production
    url: https://szofttech.inf.elte.hu/software-technology-2026/group-08/pyramids/-/packages
  script:
    - New-Item -ItemType Directory -Force -Path "$env:CI_PROJECT_DIR\Deploy" | Out-Null
    - Compress-Archive -Path "$env:CI_PROJECT_DIR\Builds\Windows\*" -DestinationPath "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" -Force
    - $packageUrl = "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/windows-build/$env:CI_COMMIT_SHORT_SHA/Transport-Tycoon.zip"
    - |
      curl.exe --fail --location --header "JOB-TOKEN: $env:CI_JOB_TOKEN" --upload-file "$env:CI_PROJECT_DIR\Deploy\Transport-Tycoon-$env:CI_COMMIT_SHORT_SHA.zip" "$packageUrl"
